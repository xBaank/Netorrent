# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{matrix.os}}
      

    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Docker on macOS
      if: ${{ matrix.os == 'macos-15-intel' }}
      id: setup-docker
      uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48
    - name: Enable ipv6 on ubuntu
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: sysctl net.ipv6.conf.all.disable_ipv6=0
    - name: Enable WSL2 on windows
      if: ${{ matrix.os == 'windows-latest' }}
      uses: Vampire/setup-wsl@v6
            
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

    - name: Test
      if: ${{ !(matrix.os == 'macos-15-intel') }}
      run: dotnet test --no-build --verbosity normal
      
    - name: Test Macos
      if: ${{ (matrix.os == 'macos-15-intel') }}
      run: sudo dotnet test --no-build --verbosity normal


