# This workflow will build and test a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Enable IPv6 UDP
      run: |
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
        sudo sysctl -w net.ipv6.conf.default.disable_ipv6=0

        # Allow everything for IPv6 (CI-safe)
        sudo ip6tables -P INPUT ACCEPT
        sudo ip6tables -P OUTPUT ACCEPT
        sudo ip6tables -P FORWARD ACCEPT

        # Explicitly allow UDP + ICMPv6
        sudo ip6tables -A INPUT -p udp -j ACCEPT
        sudo ip6tables -A OUTPUT -p udp -j ACCEPT
        sudo ip6tables -A INPUT -p ipv6-icmp -j ACCEPT
        sudo ip6tables -A OUTPUT -p ipv6-icmp -j ACCEPT
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
